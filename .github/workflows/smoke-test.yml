name: End-to-end smoke test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run unit tests
        run: ./gradlew test
      - run: ./gradlew -PsmokeTestJar bootJar
      - run: java -jar build/smoke/connector.jar smoke-test
